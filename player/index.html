<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オタク再生ツール</title>
  <meta name="description" content="YouTube・Twitchの配信を同時再生できる無料ツール。お気に入りの配信を複数並べて楽しもう！">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0e0e0e;
      color: #eee;
      font-family: "Noto Sans JP", sans-serif;
      overflow: hidden;
    }

    /* 🔹 検索バー固定＆シンプル化 */
    header {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30,30,30,0.9);
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      z-index: 1000;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input {
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
      width: 280px;
      background: #222;
      color: white;
      font-size: 0.95rem;
    }

    button {
      background: #ff4081;
      border: none;
      border-radius: 6px;
      color: white;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #e73370;
    }

    /* 🔹 プレイヤーコンテナ */
    #playerContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 100vh;
      box-sizing: border-box;
      padding-top: 70px;
    }

    .player {
      background: black;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      flex: 1 1 calc(48%);
      max-width: 48%;
      aspect-ratio: 16 / 9;
      transition: all 0.3s ease;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 🔹 削除ボタン */
    .delete-btn {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(255,0,0,0.75);
      border: none;
      border-radius: 50%;
      color: white;
      width: 26px;
      height: 26px;
      font-size: 16px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .player:hover .delete-btn { opacity: 1; }

    /* 🔹 プレイヤーなしの時の案内 */
    #emptyMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #aaa;
      font-size: 1rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .player {
        flex: 1 1 100%;
        max-width: 100%;
      }
      header {
        flex-direction: column;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <input id="urlInput" type="text" placeholder="YouTube または Twitch の URLを入力">
    <button onclick="addVideo()">追加</button>
    <button onclick="playAll()">▶ 再生</button>
    <button onclick="pauseAll()">⏸ 停止</button>
    <button onclick="removeAll()" style="background:#b00020;">🗑 全削除</button>
  </header>

  <div id="playerContainer"></div>
  <div id="emptyMessage">🎬 URLを入力して「追加」ボタンを押してください！</div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    const container = document.getElementById("playerContainer");
    const urlInput = document.getElementById("urlInput");
    const emptyMessage = document.getElementById("emptyMessage");

    function updateEmptyMessage() {
      emptyMessage.style.display = container.children.length === 0 ? "block" : "none";
    }

    function addVideo(url = null) {
      let input = url || urlInput.value.trim();
      if (!input) return alert("URLを入力してください！");
      let embedUrl = "";

      if (input.includes("twitch.tv")) {
        const channel = input.split("twitch.tv/")[1].split("/")[0];
        embedUrl = `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}`;
      } else if (input.includes("youtube.com") || input.includes("youtu.be")) {
        const match = input.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
        const videoId = match ? match[1] : null;
        if (!videoId) return alert("YouTubeのURLが無効です！");
        embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
      } else {
        return alert("対応していないURL形式です。");
      }

      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `
        <iframe src="${embedUrl}" allowfullscreen></iframe>
        <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); updateEmptyMessage();">×</button>
      `;
      container.appendChild(div);
      urlInput.value = "";
      saveState();
      updateEmptyMessage();
    }

    function playAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', "*")
      );
    }

    function pauseAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', "*")
      );
    }

    function removeAll() {
      if (confirm("すべて削除しますか？")) {
        container.innerHTML = "";
        saveState();
        updateEmptyMessage();
      }
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("players", JSON.stringify(urls));
    }

    function restoreState() {
      const saved = JSON.parse(localStorage.getItem("players") || "[]");
      saved.forEach(src => {
        const div = document.createElement("div");
        div.className = "player";
        div.innerHTML = `
          <iframe src="${src}" allowfullscreen></iframe>
          <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); updateEmptyMessage();">×</button>
        `;
        container.appendChild(div);
      });
      updateEmptyMessage();
    }

    new Sortable(container, { animation: 150, ghostClass: "sortable-ghost", onEnd: saveState });
    restoreState();
  </script>
</body>
</html>
