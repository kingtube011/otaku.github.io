<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オタク再生ツール</title>
  <style>
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      overflow: hidden;
    }

    /* ===== ハンバーガーメニュー ===== */
    .menu-button {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      z-index: 1001;
      transition: background 0.3s;
    }

    .menu-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .menu-button div {
      width: 25px;
      height: 3px;
      background: #fff;
      margin: 5px 0;
      border-radius: 2px;
      transition: all 0.3s;
    }

    /* メニュー本体 */
    .menu {
      position: fixed;
      top: 0;
      right: -220px;
      width: 200px;
      height: 100%;
      background: rgba(15, 15, 15, 0.95);
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 60px 15px;
      transition: right 0.4s ease;
      z-index: 1000;
    }

    .menu.open {
      right: 0;
    }

    .menu a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 0;
      width: 100%;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      transition: color 0.2s;
    }

    .menu a:hover {
      color: #ff80b0;
    }

    /* ===== プレイヤー配置 ===== */
    #playerContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      gap: 8px;
      transition: all 0.3s;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .player {
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
      position: relative;
      flex-shrink: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .delete-btn {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 28px;
      height: 28px;
      background: rgba(255, 0, 0, 0.75);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: none;
      z-index: 100;
    }

    .player:hover .delete-btn {
      display: block;
    }
  </style>
</head>
<body>
  <!-- 三本線ボタン -->
  <button class="menu-button" id="menuBtn">
    <div></div>
    <div></div>
    <div></div>
  </button>

  <!-- メニュー -->
  <div class="menu" id="menu">
    <a href="../index.html">🏠 トップへ戻る</a>
    <a href="../about.html">📄 このサイトについて</a>
    <a href="../privacy.html">🔒 プライバシーポリシー</a>
    <a href="../terms.html">📜 利用規約</a>
    <a href="../contact.html">✉️ お問い合わせ</a>
  </div>

  <!-- プレイヤーコンテナ -->
  <div id="playerContainer"></div>

  <script>
    const container = document.getElementById("playerContainer");
    const menu = document.getElementById("menu");
    const menuBtn = document.getElementById("menuBtn");

    // === メニュー操作 ===
    menuBtn.addEventListener("click", () => {
      menu.classList.toggle("open");
    });
    document.addEventListener("click", e => {
      if (!menu.contains(e.target) && !menuBtn.contains(e.target)) {
        menu.classList.remove("open");
      }
    });

    // === プレイヤー関係 ===
    function restoreState() {
      const saved = JSON.parse(localStorage.getItem("players") || "[]");
      saved.forEach(src => addPlayer(src));
    }

    function addPlayer(url) {
      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `
        <iframe src="${url}" allowfullscreen></iframe>
        <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); updateLayout();">×</button>`;
      container.appendChild(div);
      saveState();
      updateLayout();
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("players", JSON.stringify(urls));
    }

    function updateLayout() {
      const players = Array.from(container.querySelectorAll(".player"));
      container.innerHTML = "";
      if (players.length === 0) return;

      const rows = [];
      if (players.length <= 2) rows.push(players);
      else if (players.length === 3) rows.push(players.slice(0, 2), [players[2]]);
      else if (players.length === 4) rows.push(players.slice(0, 2), players.slice(2));
      else if (players.length === 5) rows.push(players.slice(0, 2), players.slice(2, 4), [players[4]]);
      else if (players.length === 6) rows.push(players.slice(0, 3), players.slice(3));
      else if (players.length === 7) rows.push(players.slice(0, 2), players.slice(2, 4), players.slice(4, 6), [players[6]]);
      else rows.push(players);

      const totalRows = rows.length;
      const heightPerRow = 100 / totalRows - 2;
      rows.forEach(r => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "row";
        rowDiv.style.height = heightPerRow + "vh";
        const width = 90 / r.length;
        r.forEach(p => {
          p.style.width = width + "vw";
          p.style.height = "100%";
          rowDiv.appendChild(p);
        });
        container.appendChild(rowDiv);
      });
    }

    restoreState();
    updateLayout();
  </script>
</body>
</html>
