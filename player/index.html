<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オタク再生ツール</title>
  <style>
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      overflow: hidden;
    }

    /* メニュー */
    .menu {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(20, 20, 20, 0.9);
      border-radius: 8px;
      padding: 10px;
      opacity: 0.15;
      transition: opacity 0.3s;
      z-index: 1000;
    }

    .menu:hover { opacity: 1; }

    .menu a {
      display: block;
      color: #fff;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 4px;
      background: #222;
      transition: background 0.2s;
    }

    .menu a:hover { background: #444; }

    /* プレイヤー配置 */
    #playerContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      gap: 8px;
      transition: all 0.3s;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .player {
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
      position: relative;
      flex-shrink: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .delete-btn {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 28px;
      height: 28px;
      background: rgba(255, 0, 0, 0.75);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: none;
      z-index: 100;
    }

    .player:hover .delete-btn {
      display: block;
    }
  </style>
</head>
<body>
  <!-- メニュー -->
  <div class="menu">
    <a href="../index.html">🏠 トップへ戻る</a>
    <a href="../about.html">📄 このサイトについて</a>
    <a href="../privacy.html">🔒 プライバシーポリシー</a>
    <a href="../terms.html">📜 利用規約</a>
    <a href="../contact.html">✉️ お問い合わせ</a>
  </div>

  <!-- プレイヤー -->
  <div id="playerContainer"></div>

  <script>
    const container = document.getElementById("playerContainer");

    function restoreState() {
      const saved = JSON.parse(localStorage.getItem("players") || "[]");
      saved.forEach(src => addPlayer(src));
    }

    function addPlayer(url) {
      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `
        <iframe src="${url}" allowfullscreen></iframe>
        <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); updateLayout();">×</button>`;
      container.appendChild(div);
      saveState();
      updateLayout();
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("players", JSON.stringify(urls));
    }

    function updateLayout() {
      const players = Array.from(container.querySelectorAll(".player"));
      container.innerHTML = "";
      if (players.length === 0) return;

      // 逆ピラミッド配置の行を作成
      const rows = [];
      if (players.length <= 2) rows.push(players);
      else if (players.length === 3) rows.push(players.slice(0, 2), [players[2]]);
      else if (players.length === 4) rows.push(players.slice(0, 2), players.slice(2));
      else if (players.length === 5) rows.push(players.slice(0, 2), players.slice(2, 4), [players[4]]);
      else if (players.length === 6) rows.push(players.slice(0, 3), players.slice(3));
      else if (players.length === 7) rows.push(players.slice(0, 2), players.slice(2, 4), players.slice(4, 6), [players[6]]);
      else rows.push(players);

      // サイズ計算：画面全体にフィット
      const totalRows = rows.length;
      const heightPerRow = 100 / totalRows - 2; // 少し余白
      rows.forEach(r => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "row";
        rowDiv.style.height = heightPerRow + "vh";
        const width = 90 / r.length;
        r.forEach(p => {
          p.style.width = width + "vw";
          p.style.height = "100%";
          rowDiv.appendChild(p);
        });
        container.appendChild(rowDiv);
      });
    }

    restoreState();
    updateLayout();
  </script>
</body>
</html>
