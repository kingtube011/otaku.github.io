<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オタク再生ツール</title>
  <style>
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      overflow: hidden;
    }

    /* メニューボタン */
    .menu {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(20, 20, 20, 0.9);
      border-radius: 8px;
      padding: 10px;
      transition: opacity 0.3s;
      opacity: 0.2;
    }

    .menu:hover { opacity: 1; }

    .menu a {
      display: block;
      color: #fff;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 4px;
      background: #222;
      transition: background 0.2s;
    }

    .menu a:hover { background: #444; }

    /* プレイヤーエリア */
    #playerContainer {
      display: grid;
      width: 100vw;
      height: 100vh;
      place-items: center;
      gap: 6px;
      padding: 8px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .player {
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* レイアウト自動調整 */
    @media (min-width: 1024px) {
      #playerContainer[data-count="1"] {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }
      #playerContainer[data-count="2"] {
        grid-template-columns: 1fr 1fr;
      }
      #playerContainer[data-count="3"] {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
      }
      #playerContainer[data-count="4"] {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
      }
      #playerContainer[data-count="5"] {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
      }
    }

    .delete-btn {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 28px;
      height: 28px;
      background: rgba(255, 0, 0, 0.75);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: none;
    }

    .player:hover .delete-btn {
      display: block;
    }
  </style>
</head>
<body>

  <!-- メニュー -->
  <div class="menu">
    <a href="../index.html">🏠 トップへ戻る</a>
    <a href="../about.html">📄 このサイトについて</a>
    <a href="../privacy.html">🔒 プライバシーポリシー</a>
    <a href="../terms.html">📜 利用規約</a>
    <a href="../contact.html">✉️ お問い合わせ</a>
  </div>

  <!-- プレイヤーコンテナ -->
  <div id="playerContainer" data-count="0"></div>

  <script>
    const container = document.getElementById("playerContainer");

    // ローカル保存から復元
    function restoreState() {
      const saved = JSON.parse(localStorage.getItem("players") || "[]");
      saved.forEach(src => addPlayer(src));
    }

    function addPlayer(url) {
      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `
        <iframe src="${url}" allowfullscreen></iframe>
        <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); updateLayout();">×</button>`;
      container.appendChild(div);
      saveState();
      updateLayout();
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("players", JSON.stringify(urls));
    }

    function updateLayout() {
      const count = container.querySelectorAll(".player").length;
      container.setAttribute("data-count", count);
    }

    // 初期化
    restoreState();
    updateLayout();
  </script>

</body>
</html>
