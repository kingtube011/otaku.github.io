<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-1233665276169336">
  <title>オタク再生ツール</title>
  <style>
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* 🎛 メニュー全体 */
    #menuWrapper {
      position: fixed;
      top: 10px;
      right: 15px;
      z-index: 1000;
    }

    /* ☰ボタン */
    #menuButton {
      background: rgba(50, 50, 50, 0.5);
      border: none;
      border-radius: 6px;
      width: 42px;
      height: 42px;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.4s, background 0.3s;
    }
    #menuWrapper:hover #menuButton {
      opacity: 1;
      background: rgba(50, 50, 50, 0.8);
    }

    /* 🪟メニューパネル */
    #menuPanel {
      position: absolute;
      top: 50px;
      right: 0;
      background: rgba(30, 30, 30, 0.95);
      border-radius: 10px;
      padding: 15px;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      min-width: 270px;
    }
    #menuPanel.show { display: flex; }

    #menuPanel input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #222;
      color: white;
    }

    #menuPanel button, #menuPanel a {
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      text-align: center;
    }

    #menuPanel button {
      background: #ff4081;
      border: none;
      color: white;
      cursor: pointer;
    }
    #menuPanel button:hover { background: #e73370; }

    #menuPanel a {
      background: #333;
      color: #ff80b0;
    }
    #menuPanel a:hover { background: #444; }

    /* 🎬 プレイヤー配置 */
    #playerContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
    }

    .player {
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16/9;
      transition: transform 0.3s;
      flex: 1 1 calc(45%);
      max-width: 45%;
    }

    iframe {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ❌削除ボタン */
    .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255, 0, 0, 0.8);
      border: none;
      border-radius: 50%;
      color: white;
      width: 26px;
      height: 26px;
      font-size: 16px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .player:hover .delete-btn { opacity: 1; }

    /* ↕移動ボタン */
    .move-btn {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(255, 255, 255, 0.3);
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: move;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .player:hover .move-btn { opacity: 1; }
  </style>
</head>
<body>
  <!-- 🎛 メニュー全体をhover検知エリアに -->
  <div id="menuWrapper">
    <button id="menuButton">☰</button>
    <div id="menuPanel">
      <input id="urlInput" type="text" placeholder="YouTubeまたはTwitchのURLを入力">
      <button onclick="addVideo()">追加</button>
      <button onclick="playAll()">▶ 同時再生</button>
      <button onclick="pauseAll()">⏸ 一時停止</button>
      <button onclick="removeAll()" style="background:#b00020;">🗑 全削除</button>
      <a href="about.html">このサイトについて</a>
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="terms.html">利用規約</a>
      <a href="contact.html">お問い合わせ</a>
    </div>
  </div>

  <div id="playerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    const container = document.getElementById("playerContainer");
    const urlInput = document.getElementById("urlInput");
    const menuWrapper = document.getElementById("menuWrapper");
    const menuPanel = document.getElementById("menuPanel");

    // 🪄 Hoverでメニュー表示
    menuWrapper.addEventListener("mouseenter", () => {
      menuPanel.classList.add("show");
    });
    menuWrapper.addEventListener("mouseleave", () => {
      menuPanel.classList.remove("show");
    });

    const YT_API_KEY = "AIzaSyCE_ibJnbv6DNMByQEmKM_XLU64oJ11KuE";

    function getTwitchEmbed(channel) {
      return `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}`;
    }

    async function addVideo(url = null) {
      let input = url || urlInput.value.trim();
      if (!input) return alert("URLを入力してください！");
      let embedUrl = "";

      if (input.includes("twitch.tv")) {
        const channel = input.split("twitch.tv/")[1].split("/")[0];
        embedUrl = getTwitchEmbed(channel);
      } else if (input.includes("youtube.com") || input.includes("youtu.be")) {
        const match = input.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
        const videoId = match ? match[1] : null;
        if (!videoId) return alert("YouTubeのURLが無効です！");
        embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
      } else {
        return alert("対応していないURL形式です。");
      }

      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `
        <iframe src="${embedUrl}" allowfullscreen frameborder="0"></iframe>
        <button class="delete-btn" onclick="this.parentElement.remove(); saveState();">×</button>
        <button class="move-btn" title="ドラッグで移動可能"></button>`;
      container.appendChild(div);
      urlInput.value = "";
      saveState();
      adjustLayout();
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("players", JSON.stringify(urls));
    }

    function restoreState() {
      const saved = JSON.parse(localStorage.getItem("players") || "[]");
      saved.forEach(src => {
        const div = document.createElement("div");
        div.className = "player";
        div.innerHTML = `
          <iframe src="${src}" allowfullscreen frameborder="0"></iframe>
          <button class="delete-btn" onclick="this.parentElement.remove(); saveState();">×</button>
          <button class="move-btn" title="ドラッグで移動可能"></button>`;
        container.appendChild(div);
      });
      adjustLayout();
    }

    function removeAll() {
      if (confirm("すべてのプレイヤーを削除しますか？")) {
        container.innerHTML = "";
        saveState();
      }
    }

    function playAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', "*")
      );
    }

    function pauseAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', "*")
      );
    }

    function adjustLayout() {
      const players = container.querySelectorAll(".player");
      const count = players.length;

      let width = 45;
      if (count >= 3) width = 30;
      if (count >= 5) width = 22;
      if (count >= 7) width = 18;

      players.forEach((p, i) => {
        p.style.flex = `1 1 ${width}%`;
        p.style.maxWidth = `${width}%`;
        if (count % 2 !== 0 && i === count - 1) {
          p.style.margin = "0 auto";
          p.style.display = "block";
        } else {
          p.style.margin = "0";
        }
      });
    }

    new Sortable(container, {
      animation: 150,
      ghostClass: "sortable-ghost",
      handle: ".move-btn",
      onEnd: () => saveState(),
    });

    restoreState();
  </script>
</body>
</html>
