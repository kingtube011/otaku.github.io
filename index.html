<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="オタク再生ツールは、YouTubeとTwitchのライブ配信を同時に再生できる無料のWebアプリです。複数の配信者を同時に楽しみたいファンのための便利ツール。">
  <meta name="google-adsense-account" content="ca-pub-1233665276169336">
  <title>オタク再生ツール | YouTube・Twitch同時再生プレイヤー</title>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1233665276169336" crossorigin="anonymous"></script>

  <style>
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* メニューボタン */
    #menuToggle {
      position: fixed;
      top: 15px;
      right: 20px;
      width: 42px;
      height: 42px;
      background: #222;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.3s;
      z-index: 999;
      opacity: 0.2;
    }

    #menuToggle:hover { opacity: 1; }

    #menu {
      position: fixed;
      top: 15px;
      right: 70px;
      background: rgba(20,20,20,0.95);
      border-radius: 10px;
      padding: 15px 25px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 998;
    }

    #menu a, #menu button {
      color: #fff;
      text-decoration: none;
      background: #ff4081;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s;
    }

    #menu a:hover, #menu button:hover { background: #e73370; }

    #urlInput {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-bottom: 10px;
    }

    #playerContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      gap: 8px;
      padding: 10px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .player {
      flex: 1 1 48%;
      max-width: 48%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      transition: all 0.3s ease;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .drag-btn {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 22px;
      height: 22px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      cursor: move;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .player:hover .drag-btn { opacity: 1; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: #aaa;
    }

    footer a {
      color: #ff80b0;
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    /* スクロール防止＆プレイヤー調整 */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .player { flex: 1 1 100%; max-width: 100%; }
    }
  </style>
</head>

<body>
  <div id="menuToggle">☰</div>

  <div id="menu">
    <input id="urlInput" type="text" placeholder="YouTubeまたはTwitchのURLを入力">
    <button onclick="addVideo()">追加</button>
    <button onclick="playAll()">▶ 同時再生</button>
    <button onclick="pauseAll()">⏸ 一括停止</button>
    <button onclick="removeAll()" style="background:#b00020;">🗑 全削除</button>
    <a href="about.html">このサイトについて</a>
    <a href="privacy.html">プライバシーポリシー</a>
    <a href="terms.html">利用規約</a>
    <a href="contact.html">お問い合わせ</a>
  </div>

  <main id="playerContainer"></main>

  <footer>
    <p>© 2025 オタク再生ツール | 本サイトはYouTubeおよびTwitchの公式埋め込み機能を利用しています。</p>
    <p><a href="https://paypal.me/otakuplayer486" target="_blank">運営支援はこちら</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    const container = document.getElementById("playerContainer");
    const urlInput = document.getElementById("urlInput");
    const menu = document.getElementById("menu");
    const toggle = document.getElementById("menuToggle");

    toggle.addEventListener("mouseenter", () => menu.style.display = "flex");
    menu.addEventListener("mouseleave", () => menu.style.display = "none");

    function addVideo() {
      const input = urlInput.value.trim();
      if (!input) return alert("URLを入力してください。");
      let embedUrl = "";

      if (input.includes("twitch.tv")) {
        const channel = input.split("twitch.tv/")[1].split("/")[0];
        embedUrl = `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}`;
      } else if (input.includes("youtu")) {
        const match = input.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
        if (!match) return alert("YouTubeのURLが無効です。");
        embedUrl = `https://www.youtube.com/embed/${match[1]}?enablejsapi=1`;
      } else {
        return alert("対応していないURLです。");
      }

      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `
        <iframe src="${embedUrl}" allowfullscreen></iframe>
        <div class="drag-btn" title="ドラッグで入れ替え"></div>
      `;
      container.appendChild(div);
      urlInput.value = "";
      saveState();
      adjustLayout();
    }

    function playAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', "*")
      );
    }

    function pauseAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', "*")
      );
    }

    function removeAll() {
      if (confirm("すべて削除しますか？")) {
        container.innerHTML = "";
        saveState();
      }
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("players", JSON.stringify(urls));
    }

    function restoreState() {
      const saved = JSON.parse(localStorage.getItem("players") || "[]");
      saved.forEach(src => {
        const div = document.createElement("div");
        div.className = "player";
        div.innerHTML = `
          <iframe src="${src}" allowfullscreen></iframe>
          <div class="drag-btn"></div>
        `;
        container.appendChild(div);
      });
      adjustLayout();
    }

    function adjustLayout() {
      const players = container.querySelectorAll(".player");
      const count = players.length;
      players.forEach(p => {
        if (count <= 1) { p.style.flex = "1 1 95%"; p.style.maxWidth = "95%"; }
        else if (count === 3) { p.style.flex = "1 1 48%"; p.style.maxWidth = "48%"; }
        else { p.style.flex = "1 1 31%"; p.style.maxWidth = "31%"; }
      });
    }

    new Sortable(container, { animation: 150, handle: ".drag-btn", onEnd: saveState });
    restoreState();
  </script>
</body>
</html>
