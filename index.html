<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-adsense-account" content="ca-pub-1233665276169336" />
  <title>オタク同時再生ツール</title>
  <style>
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 20px 10px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 1.8rem;
    }

    .top-buttons {
      margin-bottom: 15px;
    }

    .top-buttons a {
      display: inline-block;
      margin: 5px;
      padding: 8px 14px;
      border-radius: 6px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .yt-btn { background-color: #ff0000; }
    .twitch-btn { background-color: #9146ff; }

    p.description {
      font-size: 0.9rem;
      color: #ccc;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 60%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
      margin-right: 10px;
    }

    button {
      padding: 10px 15px;
      background: #ff4081;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #e73370; }

    #playerContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      padding: 5px;
      transition: all 0.3s ease;
    }

    .player {
      position: relative;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      flex: 1 1 calc(50% - 8px);
      aspect-ratio: 16/9;
      transition: transform 0.3s, flex 0.3s;
      max-width: 50%;
    }

    .player.small {
      flex: 1 1 calc(33.3% - 6px);
      max-width: 33.3%;
    }

    .player.tiny {
      flex: 1 1 calc(25% - 6px);
      max-width: 25%;
    }

    .player:hover { transform: scale(1.01); }

    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255, 0, 0, 0.8);
      border: none;
      border-radius: 50%;
      color: white;
      width: 28px;
      height: 28px;
      font-size: 16px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .player:hover .delete-btn { opacity: 1; }

    #streamLists {
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .stream-list {
      margin: 10px 0;
    }

    .stream-list span {
      cursor: pointer;
      margin: 0 5px;
      color: #ff4081;
    }

    .stream-list span:hover {
      text-decoration: underline;
    }

    #historySection {
      margin-top: 25px;
      color: #bbb;
      font-size: 0.9rem;
    }

    #historyContainer {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .history-item {
      cursor: pointer;
      background: #1e1e1e;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .history-item:hover { background: #333; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #bbb;
    }
    .sns-links a {
      color: #bbb;
      text-decoration: none;
      margin: 0 6px;
      transition: color 0.2s;
      font-size: 0.9rem;
    }
    .sns-links a:hover { color: #ff4081; }

    @media (max-width: 768px) {
      input[type="text"] { width: 80%; margin-bottom: 10px; }
      .player { max-width: 100% !important; flex: 1 1 100% !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 オタク同時再生ツール</h1>
    <div class="top-buttons">
      <a href="https://www.youtube.com" target="_blank" class="yt-btn">YouTubeへ</a>
      <a href="https://www.twitch.tv" target="_blank" class="twitch-btn">Twitchへ</a>
    </div>
    <p class="description">
      YouTube・Twitch対応。URLを入力して同時再生・一時停止ができます。<br>
      ※Twitchは現状、手動操作が必要な場合があります。
    </p>

    <input id="urlInput" type="text" placeholder="YouTubeまたはTwitchのURLを入力" />
    <button onclick="addVideo()">追加</button>
    <button onclick="playAll()">▶ 同時再生</button>
    <button onclick="pauseAll()">⏸ 一括一時停止</button>
    <button onclick="removeAll()" style="background:#b00020;">🗑 すべて削除</button>
  </header>

  <div id="streamLists">
    <div class="stream-list" id="youtubeList"></div>
    <div class="stream-list" id="twitchList"></div>
  </div>

  <div id="playerContainer"></div>

  <div id="historySection">
    <div>履歴</div>
    <div id="historyContainer"></div>
  </div>

  <footer>
    <div class="sns-links">
      <a href="https://x.com/kingu_486" target="_blank">X</a>｜
      <a href="https://www.youtube.com/@kingtube486" target="_blank">YouTube</a>
    </div>
    <div>サイト運営支援 → <a href="https://paypal.me/otakuplayer486" target="_blank">PayPal</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    const container = document.getElementById("playerContainer");
    const urlInput = document.getElementById("urlInput");
    const historyContainer = document.getElementById("historyContainer");

    const youtubeCreators = [
      { name: "葛葉", url: "https://www.youtube.com/@Kuzuha/streams" },
      { name: "叶", url: "https://www.youtube.com/@Kanae/streams" },
      { name: "渋谷ハル", url: "https://www.youtube.com/@ShibuyaHAL/streams" },
      { name: "一ノ瀬うるは", url: "https://www.youtube.com/@Urukaichinose/streams" },
      { name: "橘ひなの", url: "https://www.youtube.com/@hinanotachibana/streams" },
      { name: "小森めと", url: "https://www.youtube.com/@Met_Komori/streams" },
    ];

    const twitchCreators = [
      { name: "SHAKA", url: "https://www.twitch.tv/fps_shaka" },
      { name: "K4sen", url: "https://www.twitch.tv/k4sen" },
      { name: "SPYGEA", url: "https://www.twitch.tv/spygea" },
      { name: "加藤純一", url: "https://www.twitch.tv/junchannel" },
      { name: "おぼ", url: "https://www.twitch.tv/obormentv" },
      { name: "ぼどか", url: "https://www.twitch.tv/vodkavdk" },
      { name: "けんき", url: "https://www.twitch.tv/kenki" },
      { name: "赤見かるび", url: "https://www.twitch.tv/akamikarubi" },
      { name: "猫麦とろろ", url: "https://www.twitch.tv/tororo_vtuber" },
      { name: "sasatikk", url: "https://www.twitch.tv/sasatikkwo" },
    ];

    let history = JSON.parse(localStorage.getItem("videoHistory") || "[]");

    function renderLists() {
      const ytList = document.getElementById("youtubeList");
      ytList.innerHTML = youtubeCreators.map(c => `<span onclick="addVideo('${c.url}')">${c.name}</span>`).join(" ");
      const twList = document.getElementById("twitchList");
      twList.innerHTML = twitchCreators.map(c => `<span onclick="addVideo('${c.url}')">${c.name}</span>`).join(" ");
    }

    function renderHistory() {
      historyContainer.innerHTML = "";
      history.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.textContent = item.name;
        div.onclick = () => addVideo(item.url);
        historyContainer.appendChild(div);
      });
    }

    async function addVideo(inputUrl = null) {
      const url = inputUrl || urlInput.value.trim();
      if (!url) return alert("URLを入力してください！");
      let embedUrl = "";
      let name = url;

      // YouTube対応 (動画・ライブ)
      if (url.includes("youtube.com") || url.includes("youtu.be")) {
        const vMatch = url.match(/[?&]v=([a-zA-Z0-9_-]{6,})/) || url.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/);
        const videoId = vMatch ? vMatch[1] : null;

        if (videoId) {
          embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
        } else {
          try {
            const oeUrl = `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
            const oeRes = await fetch(oeUrl);
            const oeData = await oeRes.json();
            const chMatch = oeData.author_url.match(/\/channel\/(UC[0-9A-Za-z_-]+)/);
            if (chMatch) {
              embedUrl = `https://www.youtube.com/embed/live_stream?channel=${chMatch[1]}`;
            } else {
              throw new Error("No channel found");
            }
          } catch {
            return alert("YouTubeのURLが無効です。");
          }
        }
      }
      // Twitch対応
      else if (url.includes("twitch.tv")) {
        const channel = url.split("twitch.tv/")[1].split("/")[0];
        embedUrl = `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}`;
      } else {
        return alert("対応していないURL形式です。");
      }

      const frame = document.createElement("div");
      frame.className = "player";
      frame.innerHTML = `
        <iframe src="${embedUrl}" frameborder="0" allowfullscreen width="100%" height="100%"></iframe>
        <button class="delete-btn" onclick="removePlayer(this)">×</button>
      `;
      container.appendChild(frame);
      urlInput.value = "";
      saveState();
      adjustPlayerSizes();

      if (!history.some(h => h.url === url)) {
        history.unshift({ url, name });
        if (history.length > 12) history.pop();
        localStorage.setItem("videoHistory", JSON.stringify(history));
        renderHistory();
      }
    }

    function removePlayer(btn) {
      btn.parentElement.remove();
      saveState();
      adjustPlayerSizes();
    }

    function playAll() {
      document.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*')
      );
    }

    function pauseAll() {
      document.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*')
      );
    }

    function removeAll() {
      if (confirm("すべてのプレイヤーを削除しますか？")) {
        container.innerHTML = "";
        saveState();
      }
    }

    function adjustPlayerSizes() {
      const players = container.querySelectorAll(".player");
      players.forEach(p => p.classList.remove("small", "tiny"));
      if (players.length > 6) players.forEach(p => p.classList.add("tiny"));
      else if (players.length > 2) players.forEach(p => p.classList.add("small"));
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("currentPlayers", JSON.stringify(urls));
    }

    function loadState() {
      const urls = JSON.parse(localStorage.getItem("currentPlayers") || "[]");
      urls.forEach(u => {
        const frame = document.createElement("div");
        frame.className = "player";
        frame.innerHTML = `
          <iframe src="${u}" frameborder="0" allowfullscreen width="100%" height="100%"></iframe>
          <button class="delete-btn" onclick="removePlayer(this)">×</button>
        `;
        container.appendChild(frame);
      });
      adjustPlayerSizes();
    }

    new Sortable(container, { animation: 150, ghostClass: "sortable-ghost" });

    renderLists();
    renderHistory();
    loadState();
  </script>
</body>
</html>
