<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-adsense-account" content="ca-pub-1233665276169336" />
  <title>オタク同時再生ツール</title>
  <style>
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 20px 10px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 1.8rem;
    }

    .top-buttons {
      margin-bottom: 15px;
    }

    .top-buttons a {
      display: inline-block;
      margin: 5px;
      padding: 8px 14px;
      border-radius: 6px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .yt-btn { background-color: #ff0000; }
    .twitch-btn { background-color: #9146ff; }

    p.description {
      font-size: 0.9rem;
      color: #ccc;
      margin-bottom: 10px;
    }

    input[type="text"] {
      width: 60%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
      margin-right: 10px;
    }

    button {
      padding: 10px 15px;
      background: #ff4081;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #e73370; }

    #playerContainer {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
      justify-content: center;
      max-width: 1400px;
      margin: auto;
      transition: all 0.3s ease;
    }

    .player {
      position: relative;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s, width 0.3s, height 0.3s;
    }

    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255, 0, 0, 0.8);
      border: none;
      border-radius: 50%;
      color: white;
      width: 28px;
      height: 28px;
      font-size: 16px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .player:hover .delete-btn { opacity: 1; }

    #historyContainer {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #bbb;
    }

    #historyList span {
      margin: 0 8px;
      cursor: pointer;
      color: #bbb;
    }

    #historyList span:hover { color: #ff4081; }

    .creator-list {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #bbb;
    }

    .creator-list span {
      margin: 0 8px;
      cursor: pointer;
    }

    .creator-list span:hover { color: #ff4081; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #bbb;
    }

    .sns-links a {
      color: #bbb;
      text-decoration: none;
      margin: 0 6px;
      transition: color 0.2s;
      font-size: 0.9rem;
    }

    .sns-links a:hover { color: #ff4081; }

    @media (max-width: 768px) {
      input[type="text"] { width: 80%; margin-bottom: 10px; }
      #playerContainer { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 オタク同時再生ツール</h1>
    <div class="top-buttons">
      <a href="https://www.youtube.com" target="_blank" class="yt-btn">YouTubeへ</a>
      <a href="https://www.twitch.tv" target="_blank" class="twitch-btn">Twitchへ</a>
    </div>
    <p class="description">
      YouTube・Twitch対応。URLを入力して同時再生・一時停止ができます。<br>
      ※Twitchは現状、手動操作が必要な場合があります。
    </p>
    <input id="urlInput" type="text" placeholder="YouTubeまたはTwitchのURLを入力" />
    <button onclick="addVideo()">追加</button>
    <button onclick="playAll()">▶ 同時再生</button>
    <button onclick="pauseAll()">⏸ 一括停止</button>
    <button onclick="removeAll()" style="background:#b00020;">🗑 すべて削除</button>

    <div class="creator-list" id="ytList">
      <strong>YouTube配信者：</strong>
    </div>
    <div class="creator-list" id="twitchList">
      <strong>Twitch配信者：</strong>
    </div>
  </header>

  <div id="playerContainer"></div>

  <div id="historyContainer">
    <strong>📜 再生履歴：</strong>
    <div id="historyList"></div>
  </div>

  <footer>
    <div class="sns-links">
      <a href="https://x.com/kingu_486" target="_blank">X</a>｜
      <a href="https://www.youtube.com/@kingtube486" target="_blank">YouTube</a>
    </div>
    <div>サイト運営支援 → <a href="https://paypal.me/otakuplayer486" target="_blank">PayPal</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    const container = document.getElementById("playerContainer");
    const urlInput = document.getElementById("urlInput");
    const historyList = document.getElementById("historyList");
    let history = JSON.parse(localStorage.getItem("videoHistory") || "[]");

    const ytPopulars = [
      { name: "葛葉", url: "https://www.youtube.com/@Kuzuha" },
      { name: "叶", url: "https://www.youtube.com/@Kanae" },
      { name: "渋谷ハル", url: "https://www.youtube.com/@ShibuyaHAL" },
      { name: "一ノ瀬うるは", url: "https://www.youtube.com/@IchinoseUruha" },
      { name: "橘ひなの", url: "https://www.youtube.com/@HinanoTachibana" },
      { name: "小森めと", url: "https://www.youtube.com/@Met_Komori" }
    ];

    const twitchPopulars = [
      { name: "SHAKA", url: "https://www.twitch.tv/fps_shaka" },
      { name: "K4sen", url: "https://www.twitch.tv/k4sen" },
      { name: "SPYGEA", url: "https://www.twitch.tv/spygea" },
      { name: "加藤純一", url: "https://www.twitch.tv/kato_junichi0817" },
      { name: "おぼ", url: "https://www.twitch.tv/obormentv" },
      { name: "ぼどか", url: "https://www.twitch.tv/vodkavdk" },
      { name: "けんき", url: "https://www.twitch.tv/kenki" },
      { name: "赤見かるび", url: "https://www.twitch.tv/akamikarubi" },
      { name: "猫麦とろろ", url: "https://www.twitch.tv/tororo_vtuber" },
      { name: "sasatikk", url: "https://www.twitch.tv/sasatikk" }
    ];

    // --- 表示処理 ---
    function renderList(list, targetId) {
      const target = document.getElementById(targetId);
      list.forEach(item => {
        const span = document.createElement("span");
        span.textContent = item.name;
        span.onclick = () => addVideo(item.url);
        target.appendChild(span);
      });
    }

    renderList(ytPopulars, "ytList");
    renderList(twitchPopulars, "twitchList");

    function renderHistory() {
      historyList.innerHTML = "";
      history.forEach(item => {
        const span = document.createElement("span");
        span.textContent = item.name;
        span.onclick = () => addVideo(item.url);
        historyList.appendChild(span);
      });
    }

    async function addVideo(inputUrl = null) {
      const url = inputUrl || urlInput.value.trim();
      if (!url) return alert("URLを入力してください！");

      let embedUrl = "";
      if (url.includes("youtube.com") || url.includes("youtu.be")) {
        const match = url.match(/(?:v=|youtu\.be\/|live\/)([a-zA-Z0-9_-]{6,})/);
        const videoId = match ? match[1] : null;
        if (!videoId) return alert("YouTubeのURLが無効です！");
        embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
      } else if (url.includes("twitch.tv")) {
        const channel = url.split("twitch.tv/")[1].split("/")[0];
        embedUrl = `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}`;
      } else {
        return alert("対応していないURL形式です。");
      }

      const frame = document.createElement("div");
      frame.className = "player";
      frame.innerHTML = `
        <iframe src="${embedUrl}" frameborder="0" allowfullscreen width="100%" height="100%"></iframe>
        <button class="delete-btn" onclick="this.parentElement.remove(); adjustPlayerSize();">×</button>
      `;
      container.appendChild(frame);
      adjustPlayerSize();
      urlInput.value = "";

      if (!history.some(h => h.url === url)) {
        const name = url.includes("twitch.tv") ? url.split("twitch.tv/")[1].split("/")[0] : "YouTube動画";
        history.unshift({ name, url });
        if (history.length > 12) history.pop();
        localStorage.setItem("videoHistory", JSON.stringify(history));
        renderHistory();
      }

      localStorage.setItem("currentPlayers", container.innerHTML);
    }

    function playAll() {
      document.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*')
      );
    }

    function pauseAll() {
      document.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*')
      );
    }

    function removeAll() {
      if (confirm("すべてのプレイヤーを削除しますか？")) {
        container.innerHTML = "";
        localStorage.removeItem("currentPlayers");
        adjustPlayerSize();
      }
    }

    function adjustPlayerSize() {
      const count = container.children.length;
      const players = document.querySelectorAll(".player");
      players.forEach(p => {
        if (count <= 2) p.style.transform = "scale(1)";
        else if (count <= 4) p.style.transform = "scale(0.85)";
        else if (count <= 6) p.style.transform = "scale(0.75)";
        else p.style.transform = "scale(0.6)";
      });
    }

    new Sortable(container, { animation: 150, ghostClass: "sortable-ghost" });

    renderHistory();
    container.innerHTML = localStorage.getItem("currentPlayers") || "";
    adjustPlayerSize();
  </script>
</body>
</html>
