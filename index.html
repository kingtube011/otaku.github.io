      text-align: center;
    }
    header {
      padding: 60px 20px 30px;
    }
    header h1 {
      font-size: 2.4rem;
      color: #ff80b0;

    header p {
      margin: 10px auto;

    .buttons {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;

    .buttons a {
      background: #ff4081;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;

      transition: 0.3s;
    }
    .buttons a:hover {

    footer {

      padding: 20px;
      color: #888;
