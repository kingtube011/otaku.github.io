<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-1233665276169336">
  <meta name="description" content="オタク再生ツールは、YouTubeとTwitchのライブ配信を同時再生できる無料ツールです。">
  <title>オタク再生ツール</title>
  <style>
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      overflow: hidden; /* スクロール禁止 */
    }

    header { padding: 20px 10px; }
    h1 { margin-bottom: 5px; font-size: 1.8rem; }

    .top-buttons a {
      display: inline-block;
      margin: 5px;
      padding: 8px 14px;
      border-radius: 6px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .yt-btn { background-color: #ff0000; }
    .twitch-btn { background-color: #9146ff; }

    #playerContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 4px 2%;
      box-sizing: border-box;
      height: 100vh; /* 常に全画面 */
    }

    .player {
      flex: 1 1 48%;
      max-width: 48%;
      height: 48%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      transition: all 0.3s ease;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: cover; /* 黒帯防止 */
    }

    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255, 0, 0, 0.8);
      border: none;
      border-radius: 50%;
      color: white;
      width: 28px;
      height: 28px;
      font-size: 16px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .player:hover .delete-btn { opacity: 1; }

    input, button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin: 4px;
    }

    button {
      background: #ff4081;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #e73370; }

    .streamer-list {
      margin: 10px auto;
      max-width: 900px;
      color: #ff80b0;
      font-size: 0.95rem;
      line-height: 1.8;
    }

    .streamer-list span {
      margin: 0 6px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .streamer-list span:hover { color: #fff; text-decoration: underline; }

    footer {
      position: absolute;
      bottom: 5px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #bbb;
    }

    footer a {
      color: #ff80b0;
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      #playerContainer { flex-direction: column; height: auto; }
      .player { flex: 1 1 100%; max-width: 100%; height: 45vh; }
      body { overflow: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 オタク再生ツール</h1>
    <div class="top-buttons">
      <a href="https://www.youtube.com" target="_blank" class="yt-btn">YouTubeへ</a>
      <a href="https://www.twitch.tv" target="_blank" class="twitch-btn">Twitchへ</a>
    </div>
    <p>YouTube・Twitch対応。URLを入力して同時再生・一時停止ができます。</p>

    <input id="urlInput" type="text" placeholder="YouTubeまたはTwitchのURLを入力" style="width:60%;">
    <button onclick="addVideo()">追加</button>
    <button onclick="playAll()">▶ 同時再生</button>
    <button onclick="pauseAll()">⏸ 一時停止</button>
    <button onclick="removeAll()" style="background:#b00020;">🗑 全削除</button>

    <div class="streamer-list" id="youtubeList"></div>
    <div class="streamer-list" id="twitchList"></div>
  </header>

  <div id="playerContainer"></div>

  <footer>
    <a href="about.html">このサイトについて</a>｜
    <a href="privacy.html">プライバシーポリシー</a>｜
    <a href="terms.html">利用規約</a>｜
    <a href="contact.html">お問い合わせ</a>
  </footer>

  <script>
    const container = document.getElementById("playerContainer");
    const urlInput = document.getElementById("urlInput");

    const getTwitchEmbed = ch => `https://player.twitch.tv/?channel=${ch}&parent=${location.hostname}`;
    const YT_API_KEY = "AIzaSyCE_ibJnbv6DNMByQEmKM_XLU64oJ11KuE";

    async function addVideo(url = null) {
      let input = url || urlInput.value.trim();
      if (!input) return alert("URLを入力してください");
      let embedUrl = "";

      if (input.includes("twitch.tv")) {
        const ch = input.split("twitch.tv/")[1].split("/")[0];
        embedUrl = getTwitchEmbed(ch);
      } else if (input.includes("youtube.com") || input.includes("youtu.be")) {
        const match = input.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
        const id = match ? match[1] : null;
        if (!id) return alert("無効なYouTube URLです");
        embedUrl = `https://www.youtube.com/embed/${id}?enablejsapi=1`;
      } else return alert("対応していないURL形式です");

      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `
        <iframe src="${embedUrl}" allowfullscreen></iframe>
        <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); adjustLayout();">×</button>`;
      container.appendChild(div);
      urlInput.value = "";
      saveState();
      adjustLayout();
    }

    function playAll() {
      document.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', "*")
      );
    }

    function pauseAll() {
      document.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', "*")
      );
    }

    function removeAll() {
      if (confirm("全てのプレイヤーを削除しますか？")) {
        container.innerHTML = "";
        saveState();
      }
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("players", JSON.stringify(urls));
    }

    function restoreState() {
      const saved = JSON.parse(localStorage.getItem("players") || "[]");
      saved.forEach(src => {
        const div = document.createElement("div");
        div.className = "player";
        div.innerHTML = `
          <iframe src="${src}" allowfullscreen></iframe>
          <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); adjustLayout();">×</button>`;
        container.appendChild(div);
      });
      adjustLayout();
    }

    function adjustLayout() {
      const count = container.children.length;
      if (count <= 1) {
        container.style.flexDirection = "column";
      } else {
        container.style.flexDirection = "row";
        container.style.flexWrap = "wrap";
      }
    }

    window.addEventListener("resize", adjustLayout);
    restoreState();
  </script>
</body>
</html>
