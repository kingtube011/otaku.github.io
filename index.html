<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オタク再生ツール - ガジェット/ゲーム情報メディア</title>
  <meta name="description" content="オタク再生ツールは、配信同時再生ツールの提供に加え、新しいガジェットやインディーズゲームの最新情報をまとめて紹介するサイトです。">

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      background: #0e0e0e;
      color: #eee;
      line-height: 1.7;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    h1 {
      font-size: 2rem;
      color: #ff80b0;
      margin-bottom: 10px;
    }

    /* --- 記事一覧カード --- */
    .articles {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .article-card {
      display: flex;
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 0 10px rgba(255, 64, 129, 0.15);
      transition: transform 0.2s;
    }

    .article-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(255, 64, 129, 0.3);
    }

    .article-thumb {
      width: 140px;
      height: 100px;
      object-fit: cover;
    }

    .article-content {
      padding: 15px;
    }

    .article-title {
      font-size: 1.1rem;
      color: #ff80b0;
      margin: 0 0 6px;
    }

    .article-desc {
      color: #ccc;
      font-size: 0.85rem;
      margin: 0;
    }

    /* --- フッター --- */
    footer {
      text-align: center;
      margin-top: 40px;
      border-top: 1px solid #333;
      padding: 20px;
      color: #aaa;
    }

    footer a {
      color: #ff80b0;
      margin: 0 6px;
    }

    /* スマホ */
    @media (max-width: 700px) {
      .article-card {
        flex-direction: column;
      }
      .article-thumb {
        width: 100%;
        height: 180px;
      }
    }
  </style>

</head>
<body>

<header>
  <h1>オタク再生ツール</h1>
  <p>配信同時再生ツール ＋ ガジェット・ゲームレビュー</p>

</header>

  <!-- ▼ 記事カード（Steam Machine）-->

    <div class="article-content">
      <p class="article-title">Valve「Steam Machine」レビュー — 超小型ゲーミングPCの実力は？</p>
