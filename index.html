<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オタク再生ツール</title>
  <meta name="description" content="YouTubeとTwitchの配信を同時再生できるオタク再生ツール。URLを入力して複数の配信を同時視聴！">
  <style>
    body {
      margin: 0;
      background: #0e0e0e;
      color: #fff;
      font-family: "Noto Sans JP", sans-serif;
      overflow: hidden;
    }

    /* === メニュー === */
    #menuButton {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 45px;
      height: 45px;
      background: #222;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      font-size: 20px;
      z-index: 1000;
      transition: background 0.2s;
    }
    #menuButton:hover {
      background: #444;
    }

    #menuPanel {
      position: fixed;
      top: 15px;
      right: 70px;
      background: rgba(20,20,20,0.95);
      border-radius: 12px;
      padding: 15px 20px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    #menuPanel input {
      padding: 10px;
      border: none;
      border-radius: 6px;
      width: 250px;
    }

    #menuPanel button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #ff4081;
      color: #fff;
      cursor: pointer;
    }

    #menuPanel button:hover {
      background: #e73370;
    }

    /* === プレイヤー全体 === */
    #playerContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100vw;
      height: 100vh;
      padding: 8px;
      box-sizing: border-box;
    }

    .player {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      flex: 1 1 48%;
      max-width: 48%;
      transition: all 0.3s ease;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 削除ボタン */
    .delete-btn {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(255, 0, 0, 0.8);
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .player:hover .delete-btn {
      opacity: 1;
    }

    /* 入れ替えボタン（非表示→ホバーで出現） */
    .move-btn {
      position: absolute;
      bottom: 6px;
      left: 6px;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      color: #000;
      font-size: 12px;
      cursor: move;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .player:hover .move-btn {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .player {
        flex: 1 1 100%;
        max-width: 100%;
      }
      #menuPanel {
        right: 10px;
      }
    }
  </style>
</head>
<body>
  <button id="menuButton">☰</button>
  <div id="menuPanel">
    <h3>オタク再生ツール</h3>
    <input id="urlInput" type="text" placeholder="YouTubeまたはTwitchのURLを入力">
    <button onclick="addVideo()">追加</button>
    <button onclick="playAll()">▶ 同時再生</button>
    <button onclick="pauseAll()">⏸ 一括一時停止</button>
    <button onclick="removeAll()" style="background:#b00020;">🗑 全削除</button>
    <p style="font-size:0.9em; color:#ccc;">🎬 プレイヤーはドラッグして順番を入れ替え可能です。</p>
  </div>

  <div id="playerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    const container = document.getElementById("playerContainer");
    const urlInput = document.getElementById("urlInput");

    document.getElementById("menuButton").onclick = () => {
      const menu = document.getElementById("menuPanel");
      menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    };

    function getTwitchEmbed(channel) {
      return `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}`;
    }

    function addVideo(url = null) {
      let input = url || urlInput.value.trim();
      if (!input) return alert("URLを入力してください！");
      let embedUrl = "";

      if (input.includes("twitch.tv")) {
        const channel = input.split("twitch.tv/")[1].split("/")[0];
        embedUrl = getTwitchEmbed(channel);
      } else if (input.includes("youtube.com") || input.includes("youtu.be")) {
        const match = input.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
        const videoId = match ? match[1] : null;
        if (!videoId) return alert("YouTubeのURLが無効です！");
        embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
      } else {
        return alert("対応していないURL形式です。");
      }

      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `
        <iframe src="${embedUrl}" allowfullscreen></iframe>
        <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); adjustLayout();">×</button>
        <button class="move-btn" title="ドラッグで順番を入れ替え">↕</button>
      `;
      container.appendChild(div);
      urlInput.value = "";
      saveState();
      adjustLayout();
    }

    function playAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', "*")
      );
    }

    function pauseAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', "*")
      );
    }

    function removeAll() {
      if (confirm("すべてのプレイヤーを削除しますか？")) {
        container.innerHTML = "";
        saveState();
      }
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("players", JSON.stringify(urls));
    }

    function restoreState() {
      const saved = JSON.parse(localStorage.getItem("players") || "[]");
      saved.forEach(src => {
        const div = document.createElement("div");
        div.className = "player";
        div.innerHTML = `
          <iframe src="${src}" allowfullscreen></iframe>
          <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); adjustLayout();">×</button>
          <button class="move-btn" title="ドラッグで順番を入れ替え">↕</button>
        `;
        container.appendChild(div);
      });
      adjustLayout();
    }

    function adjustLayout() {
      const players = container.querySelectorAll(".player");
      const count = players.length;
      if (count === 0) return;

      const widthMap = {
        1: "96%",
        2: "48%",
        3: "48%",
        4: "48%",
        5: "31%",
        6: "31%",
        7: "31%",
        8: "24%",
        9: "24%"
      };

      players.forEach(p => {
        p.style.flex = `1 1 ${widthMap[count] || "31%"}`;
        p.style.maxWidth = widthMap[count] || "31%";
      });

      if (count % 2 === 1 && count > 1) {
        players[count - 1].style.margin = "0 auto";
        players[count - 1].style.display = "block";
      }
    }

    new MutationObserver(adjustLayout).observe(container, { childList: true });
    new Sortable(container, { animation: 150, ghostClass: "sortable-ghost", handle: ".move-btn" });

    restoreState();
  </script>
</body>
</html>
