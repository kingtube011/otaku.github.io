<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ✅ Google AdSense -->
  <meta name="google-adsense-account" content="ca-pub-1233665276169336">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1233665276169336"
     crossorigin="anonymous"></script>
  <!-- ✅ /AdSense -->

  <title>オタク同時再生ツール</title>
  <style>
    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header { padding: 20px 10px; }
    h1 { margin-bottom: 5px; font-size: 1.8rem; }

    .top-buttons a {
      display: inline-block;
      margin: 5px;
      padding: 8px 14px;
      border-radius: 6px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .yt-btn { background-color: #ff0000; }
    .twitch-btn { background-color: #9146ff; }

    #playerContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(45%, 1fr));
      gap: 4px;
      padding: 4px;
      justify-content: center;
    }

    .player {
      position: relative;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s;
    }

    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255, 0, 0, 0.8);
      border: none;
      border-radius: 50%;
      color: white;
      width: 28px;
      height: 28px;
      font-size: 16px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .player:hover .delete-btn { opacity: 1; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #bbb;
    }
    button {
      padding: 10px 15px;
      background: #ff4081;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #e73370; }

    .streamer-list {
      margin: 10px auto;
      max-width: 800px;
      color: #ff80b0;
    }
    .streamer-list span {
      margin: 0 4px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .streamer-list span:hover {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 オタク同時再生ツール</h1>
    <div class="top-buttons">
      <a href="https://www.youtube.com" target="_blank" class="yt-btn">YouTubeへ</a>
      <a href="https://www.twitch.tv" target="_blank" class="twitch-btn">Twitchへ</a>
    </div>
    <p>YouTube・Twitch対応。URLを入力して同時再生・一時停止ができます。</p>
    <input id="urlInput" type="text" placeholder="YouTubeまたはTwitchのURLを入力" style="width:60%;padding:10px;border-radius:6px;">
    <button onclick="addVideo()">追加</button>
    <button onclick="playAll()">▶ 同時再生</button>
    <button onclick="pauseAll()">⏸ 一括一時停止</button>
    <button onclick="removeAll()" style="background:#b00020;">🗑 すべて削除</button>

    <div class="streamer-list" id="youtubeList"></div>
    <div class="streamer-list" id="twitchList"></div>
  </header>

  <div id="playerContainer"></div>

  <footer>
    <div>サイト運営支援 → <a href="https://paypal.me/otakuplayer486" target="_blank" style="color:#ff4081;">PayPal</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    const container = document.getElementById("playerContainer");
    const urlInput = document.getElementById("urlInput");

    const YT_API_KEY = "AIzaSyCE_ibJnbv6DNMByQEmKM_XLU64oJ11KuE";

    const youtubeChannels = {
      "葛葉": "UCSFCh5NL4qXrAy9u-u2lX3g",
      "叶": "UCspv01oxUFf_MTSipURRhkA",
      "渋谷ハル": "UCV1xUwfM2v2oBtT3JNvic3w",
      "一ノ瀬うるは": "UCiMG6VdScBabPhJ1ZtaVmbw",
      "橘ひなの": "UCvUc0m317LWTTPZoBQV479A",
      "小森めと": "UCzUNASdzI4PV5SlqtYwAkKQ"
    };

    const twitchStreamers = [
      "fps_shaka", "k4sen", "spygea", "obormentv", "vodkavdk", 
      "kenki", "akamikarubi", "tororo_vtuber", "sasatikk"
    ];

    async function getYouTubeLiveVideo(channelId) {
      const apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&eventType=live&type=video&key=${YT_API_KEY}`;
      const res = await fetch(apiUrl);
      const data = await res.json();
      if (data.items && data.items.length > 0) {
        return data.items[0].id.videoId;
      }
      return null;
    }

    function getTwitchEmbed(channel) {
      return `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}`;
    }

    async function addVideo(url = null) {
      let input = url || urlInput.value.trim();
      if (!input) return alert("URLを入力してください！");
      let embedUrl = "";

      if (input.includes("twitch.tv")) {
        const channel = input.split("twitch.tv/")[1].split("/")[0];
        embedUrl = getTwitchEmbed(channel);
      } else if (input.includes("youtube.com") || input.includes("youtu.be")) {
        const match = input.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
        const videoId = match ? match[1] : null;
        if (!videoId) return alert("YouTubeのURLが無効です！");
        embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
      } else {
        return alert("対応していないURL形式です。");
      }

      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `
        <iframe src="${embedUrl}" allowfullscreen frameborder="0" width="100%" height="100%"></iframe>
        <button class="delete-btn" onclick="this.parentElement.remove()">×</button>`;
      container.appendChild(div);
      urlInput.value = "";
      saveState();
    }

    function playAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', "*")
      );
    }

    function pauseAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', "*")
      );
    }

    function removeAll() {
      if (confirm("すべてのプレイヤーを削除しますか？")) {
        container.innerHTML = "";
        saveState();
      }
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("players", JSON.stringify(urls));
    }

    function restoreState() {
      const saved = JSON.parse(localStorage.getItem("players") || "[]");
      saved.forEach(src => {
        const div = document.createElement("div");
        div.className = "player";
        div.innerHTML = `
          <iframe src="${src}" allowfullscreen frameborder="0" width="100%" height="100%"></iframe>
          <button class="delete-btn" onclick="this.parentElement.remove()">×</button>`;
        container.appendChild(div);
      });
    }

    async function renderStreamers() {
      const ytList = document.getElementById("youtubeList");
      const twList = document.getElementById("twitchList");

      ytList.innerHTML = Object.keys(youtubeChannels)
        .map(name => `<span onclick="loadYouTube('${youtubeChannels[name]}')">${name}</span>`)
        .join(" ");
      twList.innerHTML = twitchStreamers
        .map(name => `<span onclick="addVideo('https://www.twitch.tv/${name}')">${name}</span>`)
        .join(" ");
    }

    async function loadYouTube(channelId) {
      const videoId = await getYouTubeLiveVideo(channelId);
      if (videoId) {
        addVideo(`https://www.youtube.com/watch?v=${videoId}`);
      } else {
        alert("現在ライブ配信は行われていません。");
      }
    }

    new Sortable(container, { animation: 150, ghostClass: "sortable-ghost" });
    renderStreamers();
    restoreState();
  </script>
</body>
</html>
