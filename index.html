<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-adsense-account" content="ca-pub-1233665276169336">
  <title>オタク再生ツール</title>
  <meta name="description" content="オタク再生ツールは、YouTubeとTwitchのライブ配信を同時再生できる無料ツールです。">
  <style>
    body {
      margin: 0;
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: "Noto Sans JP", sans-serif;
      overflow: hidden; /* ← スクロール禁止 */
    }

    /* 🍔 ハンバーガーメニュー */
    .menu-button {
      position: fixed;
      top: 15px;
      right: 20px;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      z-index: 1000;
      transition: 0.3s;
    }
    .menu-button:hover { background: rgba(255, 255, 255, 0.3); }
    .menu-button span {
      display: block;
      width: 22px;
      height: 3px;
      background: white;
      margin: 4px 0;
      border-radius: 2px;
      transition: all 0.3s;
    }

    /* 📋 メニュースライド */
    .menu-panel {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100vh;
      background: rgba(20, 20, 20, 0.97);
      backdrop-filter: blur(10px);
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.5);
      padding: 30px;
      transition: right 0.4s ease;
      z-index: 999;
      box-sizing: border-box;
    }
    .menu-panel.active { right: 0; }

    .menu-panel h1 {
      color: #ff80b0;
      font-size: 1.5rem;
      margin-top: 0;
    }

    .menu-panel input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-bottom: 10px;
    }

    .menu-panel button {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      border: none;
      border-radius: 6px;
      color: white;
      background: #ff4081;
      cursor: pointer;
      transition: background 0.3s;
    }
    .menu-panel button:hover { background: #e73370; }

    .menu-panel a {
      color: #ff80b0;
      display: block;
      margin: 10px 0;
      text-decoration: none;
    }
    .menu-panel a:hover { text-decoration: underline; }

    /* 🎥 プレイヤー */
    #playerContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: grid;
      justify-content: center;
      align-content: center;
      gap: 6px;
      padding: 8px 2%;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .player {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255, 0, 0, 0.8);
      border: none;
      border-radius: 50%;
      color: white;
      width: 26px;
      height: 26px;
      font-size: 16px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .player:hover .delete-btn { opacity: 1; }

    .drag-handle {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid #ff80b0;
      border-radius: 50%;
      cursor: move;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .player:hover .drag-handle { opacity: 1; }

    @media (max-width: 768px) {
      .menu-panel { width: 80%; }
    }
  </style>
</head>

<body>
  <!-- 🍔 ハンバーガー -->
  <button class="menu-button" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>

  <!-- 📋 メニュー -->
  <div class="menu-panel" id="menuPanel">
    <h1>🎬 オタク再生ツール</h1>
    <p>YouTube・Twitch対応。<br>URLを入力して同時再生・一時停止ができます。<br><br>🎯 プレイヤーをドラッグで入れ替え可能です。</p>
    <input id="urlInput" type="text" placeholder="YouTubeまたはTwitchのURLを入力">
    <button onclick="addVideo()">追加</button>
    <button onclick="playAll()">▶ 同時再生</button>
    <button onclick="pauseAll()">⏸ 一時停止</button>
    <button onclick="removeAll()" style="background:#b00020;">🗑 すべて削除</button>
    <hr style="margin:20px 0;border-color:#333;">
    <a href="about.html">このサイトについて</a>
    <a href="privacy.html">プライバシーポリシー</a>
    <a href="terms.html">利用規約</a>
    <a href="contact.html">お問い合わせ</a>
  </div>

  <!-- 🎥 プレイヤーコンテナ -->
  <div id="playerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    const container = document.getElementById("playerContainer");
    const urlInput = document.getElementById("urlInput");

    function toggleMenu() {
      document.getElementById("menuPanel").classList.toggle("active");
    }

    function getTwitchEmbed(channel) {
      return `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}`;
    }

    async function addVideo(url = null) {
      let input = url || urlInput.value.trim();
      if (!input) return alert("URLを入力してください！");
      let embedUrl = "";

      if (input.includes("twitch.tv")) {
        const channel = input.split("twitch.tv/")[1].split("/")[0];
        embedUrl = getTwitchEmbed(channel);
      } else if (input.includes("youtube.com") || input.includes("youtu.be")) {
        const match = input.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
        const videoId = match ? match[1] : null;
        if (!videoId) return alert("YouTubeのURLが無効です！");
        embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
      } else {
        return alert("対応していないURL形式です。");
      }

      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `
        <div class="drag-handle"></div>
        <iframe src="${embedUrl}" allowfullscreen></iframe>
        <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); adjustLayout();">×</button>`;
      container.appendChild(div);
      urlInput.value = "";
      saveState();
      adjustLayout();
    }

    function adjustLayout() {
      const players = container.querySelectorAll(".player");
      const count = players.length;
      if (count === 0) return;

      const cols = Math.ceil(Math.sqrt(count)); // 自動列数
      const rows = Math.ceil(count / cols);

      container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

      players.forEach(p => {
        p.style.width = "100%";
        p.style.height = "100%";
      });
    }

    function playAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', "*")
      );
    }

    function pauseAll() {
      container.querySelectorAll("iframe").forEach(f =>
        f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', "*")
      );
    }

    function removeAll() {
      if (confirm("すべてのプレイヤーを削除しますか？")) {
        container.innerHTML = "";
        saveState();
      }
    }

    function saveState() {
      const urls = [...container.querySelectorAll("iframe")].map(f => f.src);
      localStorage.setItem("players", JSON.stringify(urls));
    }

    function restoreState() {
      const saved = JSON.parse(localStorage.getItem("players") || "[]");
      saved.forEach(src => {
        const div = document.createElement("div");
        div.className = "player";
        div.innerHTML = `
          <div class="drag-handle"></div>
          <iframe src="${src}" allowfullscreen></iframe>
          <button class="delete-btn" onclick="this.parentElement.remove(); saveState(); adjustLayout();">×</button>`;
        container.appendChild(div);
      });
      adjustLayout();
    }

    new Sortable(container, {
      animation: 200,
      handle: ".drag-handle",
      onEnd: () => { saveState(); adjustLayout(); }
    });

    restoreState();
  </script>
</body>
</html>
